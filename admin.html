<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HexScript — Admin Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { min-height: 100vh; background: #000000; color: #f5f5f5; }
  nav { padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .logo { font-size: 20px; font-weight: 800; } .logo span { color: #ffffff; }
  nav a { color: #9a9a9a; text-decoration: none; font-size: 14px; } nav a:hover { color:#fff; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
  .login { max-width: 380px; margin: 80px auto; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 36px; text-align: center; }
  input, select {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; margin-bottom: 12px; outline: none;
  }
  input:focus { border-color: #ffffff; }
  .btn { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px; background: #ffffff; color: #0a0a0a; }
  .btn:hover { opacity: .9; }
  .btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 7px; }
  .btn.red { background: #2a2a2a; }
  .btn.gray { background: rgba(255,255,255,0.1); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 14px; margin-bottom: 24px; }
  .statcard { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px; }
  .statcard .num { font-size: 26px; font-weight: 800; color: #ffffff; }
  .statcard .lbl { font-size: 11px; color: #9a9a9a; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 22px; margin-bottom: 24px; }
  .panel h3 { font-size: 15px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row input, .row select { width: auto; flex: 1; min-width: 140px; margin-bottom: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #9a9a9a; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
  td.key { font-family: Consolas, monospace; color: #d4d4d4; cursor: pointer; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .tag.perm { background: rgba(255,255,255,0.18); color: #ffffff; }
  .tag.ok { background: rgba(255,255,255,0.1); color: #e5e5e5; }
  .tag.rev { background: rgba(255,255,255,0.05); color: #9a9a9a; }
  .msg { font-size: 13px; color: #9a9a9a; min-height: 18px; margin-top: 10px; }
  .msg.ok { color: #e5e5e5; }
  #dash { display: none; }
</style>
</head>
<body>
  <nav>
    <div class="logo">HEX<span>SCRIPT</span> <span style="color:#9a9a9a;font-size:13px;font-weight:400">/ admin</span></div>
    <a href="/">← Key Page</a>
  </nav>

  <div class="login" id="login">
    <h2 style="margin-bottom:6px">🔐 Admin Login</h2>
    <p style="color:#9a9a9a;font-size:13px;margin-bottom:20px">Enter the admin password to continue</p>
    <input type="password" id="pw" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" style="width:100%" onclick="doLogin()">Login</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div class="wrap" id="dash">
    <div class="grid">
      <div class="statcard"><div class="num" id="sActive">—</div><div class="lbl">Active Keys</div></div>
      <div class="statcard"><div class="num" id="sGen">—</div><div class="lbl">Total Generated</div></div>
      <div class="statcard"><div class="num" id="sVal">—</div><div class="lbl">Validations</div></div>
    </div>

    <div class="panel">
      <h3>➕ Create Key</h3>
      <div class="row">
        <input id="customKey" placeholder="Custom key (optional, auto-generated if blank)">
        <select id="keyType">
          <option value="timed">Timed</option>
          <option value="perm">Permanent</option>
        </select>
        <input id="hours" type="number" placeholder="Hours (default 24)" style="max-width:150px">
        <button class="btn" onclick="createKey()">Create</button>
      </div>
      <div class="msg" id="createMsg"></div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3 style="margin:0">🔑 Keys</h3>
        <button class="btn sm gray" onclick="loadKeys()">↻ Refresh</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Key</th><th>Status</th><th>HWID</th><th>Uses</th><th>Expires</th><th>Actions</th></tr></thead>
          <tbody id="keyRows"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  let password = sessionStorage.getItem("adminpw") || "";

  async function api(path, body) {
    const r = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json", "x-admin-password": password },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (r.status === 401) throw new Error("unauthorized");
    return r.json();
  }

  async function doLogin() {
    password = document.getElementById("pw").value;
    try {
      await api("/api/admin/keys");
      sessionStorage.setItem("adminpw", password);
      document.getElementById("login").style.display = "none";
      document.getElementById("dash").style.display = "block";
      loadKeys();
    } catch (e) {
      document.getElementById("loginMsg").textContent = "Wrong password.";
    }
  }

  function fmtTime(t) { return t ? new Date(t).toLocaleString() : "—"; }

  async function loadKeys() {
    const r = await api("/api/admin/keys");
    document.getElementById("sActive").textContent = r.keys.filter(k => !k.revoked).length;
    document.getElementById("sGen").textContent = r.stats.generated;
    document.getElementById("sVal").textContent = r.stats.validations;
    const rows = document.getElementById("keyRows");
    rows.innerHTML = "";
    for (const k of r.keys) {
      const tr = document.createElement("tr");
      const status = k.revoked ? '<span class="tag rev">Revoked</span>'
        : k.permanent ? '<span class="tag perm">Permanent</span>'
        : '<span class="tag ok">Active</span>';
      tr.innerHTML = `
        <td class="key" title="Click to copy" onclick="navigator.clipboard.writeText('${k.key}')">${k.key}</td>
        <td>${status}</td>
        <td style="color:#9a9a9a;font-size:12px">${k.hwid ? k.hwid.slice(0, 18) + (k.hwid.length > 18 ? "…" : "") : "unbound"}</td>
        <td>${k.uses}</td>
        <td style="color:#9a9a9a;font-size:12px">${k.permanent ? "never" : fmtTime(k.expiresAt)}</td>
        <td>
          <button class="btn sm gray" onclick="resetHwid('${k.key}')">Reset HWID</button>
          ${k.revoked ? "" : `<button class="btn sm red" onclick="revoke('${k.key}')">Revoke</button>`}
          <button class="btn sm red" style="opacity:.7" onclick="del('${k.key}')">✕</button>
        </td>`;
      rows.appendChild(tr);
    }
  }

  async function createKey() {
    const permanent = document.getElementById("keyType").value === "perm";
    const hours = document.getElementById("hours").value;
    const customKey = document.getElementById("customKey").value.trim();
    const r = await api("/api/admin/create", { permanent, hours, customKey: customKey || undefined });
    const m = document.getElementById("createMsg");
    if (r.success) { m.textContent = "Created: " + r.key; m.className = "msg ok"; loadKeys(); }
    else { m.textContent = r.message; m.className = "msg"; }
  }

  async function revoke(key) { await api("/api/admin/revoke", { key }); loadKeys(); }
  async function del(key) { if (confirm("Delete " + key + "?")) { await api("/api/admin/delete", { key }); loadKeys(); } }
  async function resetHwid(key) { await api("/api/admin/reset-hwid", { key }); loadKeys(); }

  if (password) doLogin();
</script>

</html>
